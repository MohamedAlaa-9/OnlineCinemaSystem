<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set New Password - Online Cinema</title>
    <link href="../bootstrap.min.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <!-- Background Pattern -->
    <div class="cinema-pattern"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="../index.html"
              ><i class="fas fa-film me-2"></i>Cinema</a
            >
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                  <a class="nav-link" href="../index.html"
                    ><i class="fas fa-home me-1"></i> Home</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href=""><i class="fas fa-video me-1"></i> Movies</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="register.html"
                    ><i class="fas fa-user-plus me-1"></i> Register</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="login.html"
                    ><i class="fas fa-sign-in-alt me-1"></i> Login</a
                  >
                </li>
              </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-key me-2"></i> Set New Password</h1>
        </div>
    </div>

    <!-- New Password Form -->
    <div class="container my-5 fade-in">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header">
                        <h3 class="mb-0">Create New Password</h3>
                    </div>
                    <div class="card-body">
                        <form id="newPasswordForm" method="post" novalidate>
                            <div class="mb-4">
                                <label for="new_password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>New Password
                                </label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="new_password"
                                    placeholder="Enter your new password"
                                    required
                                />
                                <div class="help-text mt-2">
                                    <div id="length-check" class="mb-1">
                                        <i class="fas fa-circle help-icon"></i>
                                        At least 6 characters
                                    </div>
                                    <div id="number-check">
                                        <i class="fas fa-circle help-icon"></i>
                                        Contains at least one number
                                    </div>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="confirm_password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Confirm Password
                                </label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirm_password"
                                    placeholder="Confirm your new password"
                                    required
                                />
                                <div class="invalid-feedback">
                                    Passwords do not match
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save me-2"></i>Set New Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start">
                    <h5><i class="fas fa-film me-2"></i>Cinema</h5>
                    <p class="small">Your ultimate movie experience</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <ul class="list-inline mb-0">
                        <li class="list-inline-item">
                            <a href="https://www.facebook.com/cinema" class="text-white">
                                <i class="fab fa-facebook fa-lg mx-2"></i>
                            </a>
                        </li>
                        <li class="list-inline-item">
                            <a href="https://x.com/cinema" class="text-white">
                                <i class="fab fa-twitter fa-lg mx-2"></i>
                            </a>
                        </li>
                        <li class="list-inline-item">
                            <a href="https://www.instagram.com/cinema" class="text-white">
                                <i class="fab fa-instagram fa-lg mx-2"></i>
                            </a>
                        </li>
                    </ul>
                    <p class="small mt-2">&copy; 2025 Cinema. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="../bootstrap.bundle.min.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
